name: ctrl_scroll_zoom_guard
description: "Stops maps, charts and zoomable widgets from hijacking page scroll on Flutter web and desktop. Zoom needs Ctrl or Cmd plus scroll, with a hint overlay."
version: 0.1.0
homepage: https://github.com/senkop/ctrl_scroll_zoom_guard
repository: https://github.com/senkop/ctrl_scroll_zoom_guard
issue_tracker: https://github.com/senkop/ctrl_scroll_zoom_guard/issues
topics:
  - web
  - scroll
  - zoom
  - map
  - widget

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
